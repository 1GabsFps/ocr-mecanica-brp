server {
    listen 80;
    listen [::]:80;
    server_name mecaninca.neco.lat mecanica.neco.lat;

    # Diretório onde os arquivos de build (pasta dist) estarão na VPS
    root /var/www/mecanica-brp/dist;
    index index.html;

    # Suporte a SPA (Single Page Application - React / Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos (JS, CSS, Imagens, Fontes)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|wasm|traineddata)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Tipos MIME especiais para Tesseract WASM e modelos locais
    types {
        application/wasm wasm;
        application/octet-stream traineddata;
    }

    # Compressão Gzip para carregamento ultrarrápido
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/wasm;
    gzip_disable "MSIE [1-6]\.";

    # Headers de Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logs de acesso e erro
    access_log /var/log/nginx/mecanica_access.log;
    error_log /var/log/nginx/mecanica_error.log;
}
